<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>芯跳</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    .pet {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 4px;
      cursor: grab;
    }
    .pet:active { cursor: grabbing; }
    .mascot {
      width: 112px; height: 116px;
      animation: bob 2.4s ease-in-out infinite;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)) drop-shadow(0 0 14px var(--glow, rgba(43,245,196,.16)));
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .eye { fill: #22304a; transform-origin: var(--ex,50%) var(--ey,50%); animation: blink 4.2s infinite; }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 92%,95% { transform: scaleY(0.08); } }
    .spark { fill: #ffffff; }
    .cheek { fill: rgba(255,150,170,.5); }
    .antenna { fill: var(--accent,#2bf5c4); animation: ant 2.4s ease-in-out infinite; }
    @keyframes ant { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
    .bow { fill: var(--accent,#2bf5c4); transition: fill .3s; }
    /* 单击弹出的信息气泡 */
    .pop {
      position: absolute; bottom: 104px; left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      display: none;
      flex-direction: column; gap: 2px;
      padding: 5px 9px;
      border-radius: 9px;
      background: rgba(10,16,30,.88);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
      white-space: nowrap;
    }
    .pop.show { display: flex; animation: popIn .18s ease both; }
    @keyframes popIn { from { opacity: 0; transform: translateX(-50%) translateY(5px) scale(.92); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
    .row { display: flex; gap: 5px; align-items: baseline; justify-content: space-between; }
    .k { font-size: 9.5px; color: rgba(234,242,255,.72); }
    .v { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent,#2bf5c4); }
  </style>
</head>
<body>
  <div class="pet" id="pet">
    <div class="pop" id="pop"></div>
    <svg class="mascot" viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="headG" cx="40%" cy="26%" r="90%">
          <stop offset="0%" stop-color="#a8d4ff"/>
          <stop offset="60%" stop-color="#7db3f2"/>
          <stop offset="100%" stop-color="#4f7adf"/>
        </radialGradient>
        <radialGradient id="bodyG" cx="45%" cy="20%" r="90%">
          <stop offset="0%" stop-color="#b6ddff"/>
          <stop offset="100%" stop-color="#6a8fe6"/>
        </radialGradient>
      </defs>
      <path d="M82 100 Q104 92 100 76 Q110 98 88 108" fill="url(#bodyG)" stroke="rgba(40,70,120,.4)" stroke-width="1.2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 82 100;6 82 100;0 82 100" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="46" cy="112" rx="10" ry="7" fill="#4b6ad2"/>
      <ellipse cx="74" cy="112" rx="10" ry="7" fill="#4b6ad2"/>
      <ellipse cx="37" cy="90" rx="5" ry="8" fill="#6f9ae8" transform="rotate(18 37 90)"/>
      <ellipse cx="83" cy="90" rx="5" ry="8" fill="#6f9ae8" transform="rotate(-18 83 90)"/>
      <ellipse cx="60" cy="96" rx="19" ry="22" fill="url(#bodyG)" stroke="rgba(40,70,120,.4)" stroke-width="1.2"/>
      <ellipse cx="60" cy="100" rx="11" ry="13" fill="#e6f2ff"/>
      <path class="bow" d="M52 72 L44 64 M68 72 L76 64 M52 72 Q60 80 68 72 Z"/>
      <circle class="bow" cx="60" cy="72" r="4"/>
      <ellipse cx="60" cy="44" rx="35" ry="32" fill="url(#headG)" stroke="rgba(40,70,120,.4)" stroke-width="1.2"/>
      <path d="M46 22 V12" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-linecap="round"/>
      <circle class="antenna" cx="46" cy="9" r="3.4"/>
      <path d="M74 22 V12" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-linecap="round"/>
      <circle class="antenna" cx="74" cy="9" r="3.4"/>
      <g style="--ex:43%;--ey:47%">
        <ellipse class="eye" cx="43" cy="47" rx="7" ry="9.5"/>
        <circle class="spark" cx="45" cy="43.5" r="2.8"/>
        <circle class="spark" cx="40" cy="49" r="1.1" opacity=".7"/>
      </g>
      <g style="--ex:77%;--ey:47%">
        <ellipse class="eye" cx="77" cy="47" rx="7" ry="9.5"/>
        <circle class="spark" cx="79" cy="43.5" r="2.8"/>
        <circle class="spark" cx="74" cy="49" r="1.1" opacity=".7"/>
      </g>
      <path d="M36 36 Q43 32 50 37" stroke="rgba(40,70,120,.65)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M70 37 Q77 32 84 36" stroke="rgba(40,70,120,.65)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <ellipse class="cheek" cx="30" cy="54" rx="6" ry="3.6"/>
      <ellipse class="cheek" cx="90" cy="54" rx="6" ry="3.6"/>
      <path d="M54 56 Q60 61 66 56" stroke="rgba(40,70,120,.7)" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
  <script src="js/hud.js"></script>
</body>
</html>
